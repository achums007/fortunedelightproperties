services:
  # 1. The PHP Engine (Running your Laravel code)
  app:
    build: .
    container_name: project1_php
    volumes:
      - .:/var/www/html
    environment:
      - TMPDIR=/var/www/html/storage/framework/cache
      - TEMP=/var/www/html/storage/framework/cache
    networks:
      - project-network

  # 2. The Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: project1_web
    ports:
      - "8085:80" 
    volumes:
      - .:/var/www/html
      - ./docker/nginx:/etc/nginx/conf.d 
    depends_on:
      - app
    networks:
      - project-network

  # 3. Dedicated Node Service (Added for Frontend compilation / Scripts)
  node:
    image: node:20-alpine
    container_name: project1_node
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "5173:5173" # Expose Vite dev server port if using modern Laravel
    profiles:
      - dev # Optional: Only starts this container if you explicitly ask for it
    networks:
      - project-network
    # Keeps the container alive, or replace with "npm run dev" if you want it to auto-start Vite
    command: sh -c "npm install && npm run dev -- --host" 

networks:
  project-network:
    name: my-shared-network 
    external: true